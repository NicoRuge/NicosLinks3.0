<!doctype html>
<html lang="de" data-bs-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nico's Links</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e09a20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nico's Links">
    <link rel="apple-touch-icon" href="assets/icons/Logo_White.svg">
    <style>
        .skeleton-box {
            background-color: var(--bs-secondary-bg-subtle);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-box::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0,
                    rgba(255, 255, 255, 0.05) 20%,
                    rgba(255, 255, 255, 0.1) 60%,
                    rgba(255, 255, 255, 0));
            animation: skeleton-shimmer 2s infinite;
        }

        @keyframes skeleton-shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body class="bg-body">

    <div id="app" v-cloak>
        <!-- Mobile Menu Toggle -->
        <button v-if="currentHash !== 'qr'" class="btn btn-secondary d-lg-none mobile-menu-toggle" @click="toggleSidebar"
            aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
        </button>

        <!-- Sidebar Overlay -->
        <div v-if="currentHash !== 'qr'" class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="closeSidebar"></div>

        <!-- Sidebar -->
        <nav v-if="currentHash !== 'qr'" class="sidebar" :class="{ 'mobile-open': sidebarOpen }">
            <div class="scroll-hint-shell sidebar-main-shell">
                <div class="sidebar-main">
                    <div class="sidebar-brand">
                        <img
                            :src="activeTheme === 'light' ? 'assets/icons/Logo_Black.svg' : 'assets/icons/Logo_White.svg'"
                            alt="Nico's Links"
                            class="sidebar-brand-logo"
                        >
                    </div>

                    <div v-for="section in navigation" :key="section.title">
                        <div v-if="section.title" class="sidebar-section">{{ section.title }}</div>
                        <ul class="nav flex-column">
                            <li v-for="item in section.items" :key="item.id" class="nav-item">
                                <a class="nav-link"
                                    :class="{ active: currentHash === item.id, 'text-secondary opacity-75': item.wip }" href="#"
                                    @click.prevent="navigate(item.id); closeSidebar()">
                                    <img :src="'assets/icons/' + item.icon" alt="" class="sidebar-icon"
                                        :style="item.wip ? 'opacity: 0.5' : ''">
                                    {{ item.label }}
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="sidebar-now-playing">
                <div class="sidebar-utility-pill" role="group" aria-label="Theme and language controls">
                    <div class="dropdown flex-fill">
                        <button
                            class="btn sidebar-utility-btn dropdown-toggle d-flex align-items-center justify-content-center w-100"
                            id="sidebar-theme-toggle" type="button" aria-expanded="false" data-bs-toggle="dropdown"
                            aria-label="Toggle theme">
                            <i :class="activeThemeIcon" class="me-2 theme-icon-active"></i>
                            Theme
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li v-for="t in themes" :key="t.value">
                                <button type="button" class="dropdown-item d-flex align-items-center"
                                    :class="{ active: storedTheme === t.value }" @click="setTheme(t.value)">
                                    <i :class="t.icon" class="me-2 opacity-50"></i>
                                    {{ t.label }}
                                    <i v-if="storedTheme === t.value" class="bi bi-check2 ms-auto"></i>
                                </button>
                            </li>
                        </ul>
                    </div>
                    <div class="dropdown flex-fill">
                        <button
                            class="btn sidebar-utility-btn dropdown-toggle d-flex align-items-center justify-content-center w-100"
                            id="sidebar-language-toggle" type="button" aria-expanded="false" data-bs-toggle="dropdown"
                            aria-label="Toggle language">
                            <i class="bi bi-translate me-2"></i>
                            Language
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li v-for="l in languages" :key="l.value">
                                <button type="button" class="dropdown-item d-flex align-items-center"
                                    :class="{ active: lang === l.value }" @click="setLanguage(l.value)">
                                    <i class="bi bi-translate me-2 opacity-50"></i>
                                    {{ l.label }}
                                    <i v-if="lang === l.value" class="bi bi-check2 ms-auto"></i>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
                <div v-if="deferredInstallPrompt && !pwaInstalled" class="sidebar-install-wrap">
                    <button @click="installPWA" class="btn sidebar-utility-btn w-100 d-flex align-items-center justify-content-center sidebar-install-btn">
                        <i class="bi bi-download me-2"></i>{{ t('pwa.installTitle') }}
                    </button>
                </div>

                <div class="sidebar-widget-carousel">
                    <div class="sidebar-widget-track" id="sidebar-widget-track">
                        <div id="spotify-sidebar-widget" class="sidebar-now-playing-widget sidebar-widget-slide">
                            <div class="skeleton-box" style="width: 70%; height: 12px; margin-bottom: 10px;"></div>
                            <div class="d-flex align-items-center gap-2">
                                <div class="skeleton-box" style="width: 34px; height: 34px; border-radius: 8px;"></div>
                                <div class="flex-grow-1">
                                    <div class="skeleton-box" style="width: 80%; height: 12px; margin-bottom: 7px;"></div>
                                    <div class="skeleton-box" style="width: 58%; height: 10px;"></div>
                                </div>
                            </div>
                        </div>
                        <div id="steam-sidebar-widget" class="sidebar-now-playing-widget sidebar-widget-slide">
                            <div class="skeleton-box" style="width: 50%; height: 12px; margin-bottom: 10px;"></div>
                            <div class="d-flex align-items-center gap-2">
                                <div class="skeleton-box" style="width: 34px; height: 34px; border-radius: 8px;"></div>
                                <div class="flex-grow-1">
                                    <div class="skeleton-box" style="width: 75%; height: 12px; margin-bottom: 7px;"></div>
                                    <div class="skeleton-box" style="width: 45%; height: 10px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="sidebar-widget-dots">
                        <span class="sidebar-widget-dot active" data-index="0"></span>
                        <span class="sidebar-widget-dot" data-index="1"></span>
                    </div>
                </div>
            </div>

            <div class="sidebar-legal">
                <a class="nav-link sidebar-legal-link" :class="{ active: currentHash === 'imprint' }" href="#"
                    @click.prevent="navigate('imprint'); closeSidebar()">
                    {{ t('nav.imprint') }}
                </a>
                <a class="nav-link sidebar-legal-link"
                    :class="{ active: currentHash === 'privacy-policy' || currentHash === 'privacy-policy-main' || currentHash === 'privacy-policy-cloud' }"
                    href="#" @click.prevent="navigate('privacy-policy-main'); closeSidebar()">
                    {{ t('nav.privacyPolicy') }}
                </a>
            </div>
        </nav>

        <!-- Main content -->
        <main class="main-content" :class="{ 'qr-page-mode': currentHash === 'qr' }">
            <div class="scroll-hint-shell content-scroll-shell">
                <div id="content-container" class="page-content" :class="currentHash === 'qr' || currentHash === 'home' ? 'py-0' : 'py-4'">
                    <home-view v-if="currentHash === 'home'"></home-view>
                    <qr-view v-else-if="currentHash === 'qr'"></qr-view>
                    <photography-view v-else-if="currentHash === 'photography'"></photography-view>
                    <travelling-view v-else-if="currentHash === 'travelling'"></travelling-view>
                    <trip-sample-view v-else-if="currentHash === 'trips'"></trip-sample-view>
                    <departures-view v-else-if="currentHash === 'departures'"></departures-view>
                    <camera-equipment-view v-else-if="currentHash === 'camera-equipment'"></camera-equipment-view>
                    <blog-view v-else-if="currentHash === 'blog'"></blog-view>
                    <x-thread-viewer-view v-else-if="currentHash === 'x-thread-viewer'"></x-thread-viewer-view>
                    <tweet-viewer-view v-else-if="currentHash === 'tweet-viewer'"></tweet-viewer-view>
                    <data-analytics-view v-else-if="currentHash === 'data-analytics'"></data-analytics-view>
                    <imprint-view v-else-if="currentHash === 'imprint'"></imprint-view>
                    <privacy-policy-view
                        v-else-if="currentHash === 'privacy-policy' || currentHash === 'privacy-policy-main' || currentHash === 'privacy-policy-cloud'">
                    </privacy-policy-view>
                    <div v-else v-html="contentFragment"></div>
                </div>
            </div>

            <div class="nico-toast-container">
                <div id="desktop-random-toast" class="toast nico-random-toast" role="status" aria-live="polite"
                    aria-atomic="true">
                    <div class="toast-header nico-random-toast-header">
                        <small class="text-body-secondary">Hinweis</small>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="toast"
                            aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        {{ activeToastMessage }}
                    </div>
                </div>
            </div>

            <footer class="footer mt-auto py-3 bg-body-tertiary border-top">
                <div class="container-fluid d-flex flex-wrap justify-content-start align-items-center">
                    <div class="col-md-4 d-flex align-items-center">
                        <span class="mb-3 mb-md-0 text-body-secondary">Made with ❤ on an ICE 3neo</span>
                    </div>
                </div>
            </footer>
        </main>
        <!-- PWA Install Banner -->
        <transition name="pwa-banner">
            <div v-if="showInstallBanner" class="pwa-install-banner" role="banner">
                <div class="pwa-install-banner-inner">
                    <img :src="activeTheme === 'light' ? 'assets/icons/Logo_Black.svg' : 'assets/icons/Logo_White.svg'"
                        alt="App icon" class="pwa-install-icon">
                    <div class="pwa-install-text">
                        <span class="pwa-install-title">{{ t('pwa.installTitle') }}</span>
                        <span class="pwa-install-sub">{{ t('pwa.installSubtitle') }}</span>
                    </div>
                    <button @click="installPWA" class="btn btn-primary btn-sm pwa-install-btn">
                        <i class="bi bi-download me-1"></i>{{ t('pwa.install') }}
                    </button>
                    <button @click="dismissInstallBanner" class="btn-close pwa-install-close"
                        :class="activeTheme === 'dark' ? 'btn-close-white' : ''"
                        :aria-label="t('pwa.dismiss')"></button>
                </div>
            </div>
        </transition>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="assets/js/widget_spotify.js"></script>
    <script src="assets/js/widget_steam_sidebar.js"></script>
    <script src="assets/js/page_home.js"></script>
    <script src="assets/js/page_qr.js"></script>
    <script src="assets/js/page_photography.js"></script>
    <script src="assets/js/page_travelling.js"></script>
    <script src="assets/js/page_trips.js"></script>
    <script src="assets/js/page_other.js"></script>
    <script src="assets/js/page_departures.js"></script>
    <script src="assets/js/page_camera_equipment.js"></script>
    <script src="assets/js/page_x_thread_viewer.js"></script>
    <script src="assets/js/page_tweet_viewer.js"></script>
    <script src="assets/js/page_data_analytics.js"></script>
    <script src="assets/js/page_legal.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script>
        const { createApp } = Vue
        const SIDEBAR_I18N = {
            de: {
                'nav.home': 'Start',
                'nav.section.work': 'Arbeit',
                'nav.photography': 'Fotografie',
                'nav.cameraEquipment': 'Kameraausruestung',
                'nav.section.projects': 'Projekte',
                'nav.travelMap': 'Reisekarte',
                'nav.trips': 'Reisen',
                'nav.departures': 'Abfahrten',
                'nav.section.otherStuff': 'Sonstiges',
                'nav.blog': 'Blog',
                'nav.xThreadViewer': 'X Thread Viewer',
                'nav.tweetViewer': 'Post Viewer',
                'nav.dataAnalytics': 'Datenanalyse',
                'nav.imprint': 'Impressum',
                'nav.privacyPolicy': 'Datenschutz',
                'pwa.install': 'Installieren',
                'pwa.installTitle': 'Als App installieren',
                'pwa.installSubtitle': 'Zum Startbildschirm hinzufügen',
                'pwa.dismiss': 'Schließen'
            },
            en: {
                'nav.home': 'Home',
                'nav.section.work': 'Work',
                'nav.photography': 'Photography',
                'nav.cameraEquipment': 'Camera Equipment',
                'nav.section.projects': 'Projects',
                'nav.travelMap': 'Travel Map',
                'nav.trips': 'Trips',
                'nav.departures': 'Departures',
                'nav.section.otherStuff': 'Other Stuff',
                'nav.blog': 'Blog',
                'nav.xThreadViewer': 'X Thread Viewer',
                'nav.tweetViewer': 'Post Viewer',
                'nav.dataAnalytics': 'Data Analytics',
                'nav.imprint': 'Imprint',
                'nav.privacyPolicy': 'Privacy Policy',
                'pwa.install': 'Install',
                'pwa.installTitle': 'Install as App',
                'pwa.installSubtitle': 'Add to home screen',
                'pwa.dismiss': 'Dismiss'
            }
        }

        createApp({
            components: {
                'home-view': HomeView,
                'qr-view': QrView,
                'photography-view': PhotographyView,
                'travelling-view': TravellingView,
                'trip-sample-view': TripSampleView,
                'departures-view': DeparturesView,
                'camera-equipment-view': CameraEquipmentView,
                'blog-view': BlogView,
                'x-thread-viewer-view': XThreadViewerView,
                'tweet-viewer-view': TweetViewerView,
                'data-analytics-view': DataAnalyticsView,
                'imprint-view': ImprintView,
                'privacy-policy-view': PrivacyPolicyView
            },
            data() {
                return {
                    currentHash: 'home',
                    contentFragment: '',
                    storedTheme: localStorage.getItem('theme') || 'auto',
                    lang: localStorage.getItem('lang') || 'de',
                    activeTheme: 'light',
                    sidebarOpen: false,
                    deferredInstallPrompt: null,
                    showInstallBanner: false,
                    pwaInstalled: false,
                    scrollHintUpdate: null,
                    scrollHintTeardown: null,
                    activeToastMessage: '',
                    toastMessages: [
                        'Wer schweigt, stimmt zu - lasst Faschisten nicht in Ruh!',
                        'Kein Platz für Rassismus!',
                        'Trans rights are human rights!',
                        'Kein Mensch ist illegal!',
                        'Menschenrechte statt rechte Menschen!',
                        'NoAfD!',
                        'FCKAFD!',
                        'Nie wieder ist jetzt!',
                        'Alerta, alerta, antifascista!',
                        'Solidarität statt Hass!',
                        'Bunt statt braun!',
                        'Nazis raus!',
                        'Vielfalt verteidigen!',
                        'Demokratie verteidigen!',
                        'Gegen jeden Antisemitismus!',
                        'Love wins!',
                        'Rechte Hetze stoppen!',
                        'Zusammen gegen Rechts!',
                        'Kein Vergessen, kein Vergeben!',
                        'Refugees welcome!',
                        'Hass ist keine Meinung!',
                        'Faschismus ist keine Alternative!',
                        'Unsere Alternative heißt Solidarität!',
                        'Queer gegen Rechts!',
                        'Nie wieder 1933!',
                    ],
                    navigationConfig: [
                        {
                            items: [
                                { id: 'home', labelKey: 'nav.home', icon: 'home.svg' }
                            ]
                        },
                        {
                            titleKey: 'nav.section.work', items: [
                                { id: 'photography', labelKey: 'nav.photography', icon: 'images.svg' },
                                { id: 'camera-equipment', labelKey: 'nav.cameraEquipment', icon: 'camera.svg' }
                            ]
                        },
                        {
                            titleKey: 'nav.section.projects', items: [
                                { id: 'travelling', labelKey: 'nav.travelMap', icon: 'globe.svg' },
                                { id: 'trips', labelKey: 'nav.trips', icon: 'plane.svg' },
                                { id: 'departures', labelKey: 'nav.departures', icon: 'train-front.svg' }
                            ]
                        },
                        {
                            titleKey: 'nav.section.otherStuff', items: [
                                { id: 'blog', labelKey: 'nav.blog', icon: 'book-open-text.svg' },
                                { id: 'x-thread-viewer', labelKey: 'nav.xThreadViewer', icon: 'twitter.svg' },
                                { id: 'tweet-viewer', labelKey: 'nav.tweetViewer', icon: 'twitter.svg' },
                                { id: 'data-analytics', labelKey: 'nav.dataAnalytics', icon: 'bar-chart.svg' }
                            ]
                        }
                    ],
                    themes: [
                        { value: 'light', label: 'Light', icon: 'bi-sun-fill text-warning' },
                        { value: 'dark', label: 'Dark', icon: 'bi-moon-stars-fill text-primary' },
                        { value: 'auto', label: 'Auto', icon: 'bi-circle-half' }
                    ],
                    languages: [
                        { value: 'de', label: 'Deutsch' },
                        { value: 'en', label: 'English' }
                    ]
                }
            },
            computed: {
                activeThemeIcon() {
                    const found = this.themes.find(t => t.value === this.storedTheme)
                    const icon = found ? found.icon : 'bi-circle-half'
                    return icon.replace('text-warning', '').replace('text-primary', '')
                },
                navigation() {
                    return this.navigationConfig.map((section) => ({
                        title: section.titleKey ? this.t(section.titleKey) : '',
                        items: section.items.map((item) => ({
                            ...item,
                            label: this.t(item.labelKey)
                        }))
                    }))
                }
            },
            methods: {
                t(key) {
                    return SIDEBAR_I18N[this.lang]?.[key] || SIDEBAR_I18N.en[key] || key
                },
                setLanguage(lang) {
                    const normalized = lang === 'en' ? 'en' : 'de'
                    this.lang = normalized
                    localStorage.setItem('lang', normalized)
                    document.documentElement.setAttribute('lang', normalized)
                },
                loadPageContent(page) {
                    this.contentFragment = '';
                },
                toggleSidebar() {
                    this.sidebarOpen = !this.sidebarOpen;
                },
                closeSidebar() {
                    this.sidebarOpen = false;
                },
                navigate(page) {
                    window.location.hash = page
                },
                syncRobotsMeta() {
                    const isImprint = this.currentHash === 'imprint'
                    const desiredContent = isImprint ? 'noindex, follow' : 'index, follow'
                    let robotsMeta = document.querySelector('meta[name="robots"]')
                    if (!robotsMeta) {
                        robotsMeta = document.createElement('meta')
                        robotsMeta.setAttribute('name', 'robots')
                        document.head.appendChild(robotsMeta)
                    }
                    robotsMeta.setAttribute('content', desiredContent)
                },
                updateFromHash() {
                    const hash = window.location.hash.substring(1) || 'home'
                    if (hash === 'card') {
                        window.location.hash = 'home'
                        return
                    }
                    this.currentHash = hash === 'privacy-policy' ? 'privacy-policy-main' : hash
                    this.loadPageContent(this.currentHash)
                    this.syncRobotsMeta()
                    this.$nextTick(() => this.refreshScrollHints())
                },
                setTheme(theme) {
                    this.storedTheme = theme
                    localStorage.setItem('theme', theme)
                    this.applyTheme()
                },
                applyTheme() {
                    const actualTheme = this.storedTheme === 'auto'
                        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                        : this.storedTheme
                    this.activeTheme = actualTheme
                    document.documentElement.setAttribute('data-bs-theme', actualTheme)
                },
                showDesktopToast() {
                    const toastElement = document.getElementById('desktop-random-toast')
                    if (!toastElement || !window.bootstrap?.Toast || this.toastMessages.length === 0) return

                    const randomIndex = Math.floor(Math.random() * this.toastMessages.length)
                    this.activeToastMessage = this.toastMessages[randomIndex]

                    this.$nextTick(() => {
                        const toast = bootstrap.Toast.getOrCreateInstance(toastElement, {
                            autohide: true,
                            delay: 6000
                        })
                        toast.show()
                    })
                },
                setupScrollHints() {
                    const targets = [
                        document.querySelector('.sidebar-main'),
                        document.getElementById('content-container')
                    ]
                        .filter(Boolean)
                        .map((el) => ({
                            el,
                            shell: el.closest('.scroll-hint-shell') || el
                        }))
                    if (targets.length === 0) return

                    const threshold = 6
                    const updateTarget = ({ el, shell }) => {
                        const canScroll = el.scrollHeight - el.clientHeight > threshold
                        const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - threshold
                        shell.classList.add('scroll-hint-target')
                        shell.classList.toggle('show-scroll-hint', canScroll && !atBottom)
                    }
                    const updateAll = () => {
                        targets.forEach(updateTarget)
                    }
                    const onScroll = (event) => {
                        const target = targets.find((entry) => entry.el === event.currentTarget)
                        if (target) updateTarget(target)
                    }

                    targets.forEach(({ el }) => {
                        el.addEventListener('scroll', onScroll, { passive: true })
                    })
                    window.addEventListener('resize', updateAll)

                    let resizeObserver = null
                    if ('ResizeObserver' in window) {
                        resizeObserver = new ResizeObserver(updateAll)
                        targets.forEach(({ el }) => resizeObserver.observe(el))
                    }

                    this.scrollHintUpdate = () => {
                        window.requestAnimationFrame(updateAll)
                    }
                    this.scrollHintTeardown = () => {
                        targets.forEach(({ el }) => {
                            el.removeEventListener('scroll', onScroll)
                        })
                        window.removeEventListener('resize', updateAll)
                        if (resizeObserver) resizeObserver.disconnect()
                    }
                    this.scrollHintUpdate()
                },
                refreshScrollHints() {
                    if (typeof this.scrollHintUpdate === 'function') {
                        this.scrollHintUpdate()
                    }
                },
                handleInstallPrompt(e) {
                    e.preventDefault()
                    this.deferredInstallPrompt = e
                    const dismissed = localStorage.getItem('pwa-banner-dismissed')
                    const cooldown = 7 * 24 * 60 * 60 * 1000
                    if (!dismissed || Date.now() - parseInt(dismissed) > cooldown) {
                        setTimeout(() => { this.showInstallBanner = true }, 2500)
                    }
                },
                async installPWA() {
                    if (!this.deferredInstallPrompt) return
                    this.deferredInstallPrompt.prompt()
                    const { outcome } = await this.deferredInstallPrompt.userChoice
                    if (outcome === 'accepted') {
                        this.pwaInstalled = true
                        this.showInstallBanner = false
                    }
                    this.deferredInstallPrompt = null
                },
                dismissInstallBanner() {
                    this.showInstallBanner = false
                    localStorage.setItem('pwa-banner-dismissed', Date.now().toString())
                }
            },
            mounted() {
                this.setLanguage(this.lang)
                this.updateFromHash()
                this.applyTheme()
                this.showDesktopToast()
                this.setupScrollHints()
                window.addEventListener('hashchange', this.updateFromHash)
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                    if (this.storedTheme === 'auto') this.applyTheme()
                })
                window.addEventListener('beforeinstallprompt', (e) => this.handleInstallPrompt(e))
                window.addEventListener('appinstalled', () => {
                    this.pwaInstalled = true
                    this.showInstallBanner = false
                    this.deferredInstallPrompt = null
                })
                if ('serviceWorker' in navigator) {
